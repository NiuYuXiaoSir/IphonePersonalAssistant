## 在 GitHub 的 macOS runner 上编译出未签名的 ipa。
## 签名由电脑端的侧载工具（Sideloadly / AltStore）用免费 Apple ID 完成。
##
## 本项目没有 Mac，所以这个流水线额外承担了“报错回传”的职责：
## 编译失败时把编译器错误写成 ci/build-error.log 提交回仓库，
## 这样在本地就能读到错误（GitHub Actions 的日志需要登录才能看）。

name: Build unsigned IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选用最新可用的 Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用: $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（无签名）
        id: compile
        working-directory: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project IPhoneAssistant.xcodeproj \
            -scheme IPhoneAssistant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../build.log

      - name: 编译失败时就地记录错误
        if: steps.compile.outcome == 'failure'
        run: |
          mkdir -p ci
          {
            echo "# 构建失败"
            echo ""
            echo "- 构建号: $GITHUB_RUN_NUMBER"
            echo "- 提交: $GITHUB_SHA"
            echo "- 时间: $(date -u +%FT%TZ)"
            echo ""
            echo "## 编译器错误"
            echo '```'
            grep -n -E "error:" build.log | head -80 || echo "(没搜到 error: 行，看下面的日志尾部)"
            echo '```'
            echo ""
            echo "## 日志尾部"
            echo '```'
            tail -80 build.log
            echo '```'
          } > ci/build-error.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/build-error.log
          git commit -m "CI: 记录构建失败 [skip ci]" || true
          git push origin HEAD:main || echo "推送失败"
          exit 1

      - name: 打包成 ipa
        if: steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          APP=$(find ios/build/Build/Products -maxdepth 3 -name "IPhoneAssistant.app" | head -1)
          echo "产物: $APP"
          if [ -z "$APP" ]; then echo "没找到 .app，编译可能失败了"; exit 1; fi
          rm -rf Payload IPhoneAssistant-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry -X IPhoneAssistant-unsigned.ipa Payload
          ls -lh IPhoneAssistant-unsigned.ipa

      - name: 备份到 Actions artifact
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAssistant-unsigned-ipa
          path: IPhoneAssistant-unsigned.ipa
          retention-days: 30

      - name: 发布到 latest Release
        if: steps.compile.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 IPhoneAssistant-unsigned.ipa | awk '{print $1}')
          NOTES=$(printf '每次 push 自动更新。\n\n**在电脑上下载**（Sideloadly 通过数据线装机，手机不需要联网下载）。\n\n下载后校验完整性：\n```\ncertutil -hashfile IPhoneAssistant-unsigned.ipa SHA256\n```\nSHA256: `%s`' "$SHA")

          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新构建" --notes "初始化"
          gh release upload latest IPhoneAssistant-unsigned.ipa --clobber
          gh release edit latest --notes "$NOTES"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/IPhoneAssistant-unsigned.ipa"
          {
            echo "### 📦 下载地址"
            echo ""
            echo "$URL"
            echo ""
            echo "SHA256: \`$SHA\`"
            echo ""
            echo "构建 #${GITHUB_RUN_NUMBER} · 提交 \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "下载地址: $URL"
          echo "SHA256: $SHA"
