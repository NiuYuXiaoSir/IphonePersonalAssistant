## XcodeGen 工程描述文件
## 用 CI 里的 `xcodegen generate` 生成 .xcodeproj，避免手工维护 project.pbxproj
##
## ⚠️ 需要你改的地方：PRODUCT_BUNDLE_IDENTIFIER
## 免费签名要求 App ID 全局唯一，如果 CI 能过但装机时报
## "The app ID ... is not available"，就换一个更随机的后缀再试。

name: IPhoneAssistant

options:
  bundleIdPrefix: com.niuyuxiaosir
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  IPhoneAssistant:
    type: application
    platform: iOS

    sources:
      - path: IPhoneAssistant
        # Info.plist 由 XcodeGen 依据下面的 info 段生成，必须排除，
        # 否则会被当成资源重复打包，报 "Multiple commands produce Info.plist"
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niuyuxiaosir.iphoneassistant.probe
        PRODUCT_NAME: IPhoneAssistant
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # CI 里做无签名构建，签名交给手机端的侧载工具完成
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

    info:
      path: IPhoneAssistant/Info.plist
      properties:
        CFBundleDisplayName: 助理探针
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # —— 以下是 PRD 第 12.2 节要求的权限声明，E1 阶段就验证系统弹窗是否正常 ——
        NSMicrophoneUsageDescription: 录制会议音频，用于会后转写与总结。
        NSSpeechRecognitionUsageDescription: 把会议录音转成文字，用于生成纪要。
        NSCalendarsFullAccessUsageDescription: 读取和写入日历，用于管理你的工作日程。
        NSRemindersFullAccessUsageDescription: 读取和写入提醒事项，用于管理你的待办。
        # 后台持续录音的前提，免费签名下是否可用由 E1 验证
        UIBackgroundModes:
          - audio
        # 让 Documents 目录出现在「文件」App 里，方便导出探针报告和后续的会议录音
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

schemes:
  IPhoneAssistant:
    build:
      targets:
        IPhoneAssistant: all
    run:
      config: Debug
    archive:
      config: Release
