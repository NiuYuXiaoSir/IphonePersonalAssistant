## XcodeGen 工程描述文件
## 用 CI 里的 `xcodegen generate` 生成 .xcodeproj，避免手工维护 project.pbxproj
##
## ⚠️ 需要你改的地方：PRODUCT_BUNDLE_IDENTIFIER
## 免费签名要求 App ID 全局唯一，如果 CI 能过但装机时报
## "The app ID ... is not available"，就换一个更随机的后缀再试。

name: IPhoneAssistant

options:
  bundleIdPrefix: com.niuyuxiaosir
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  IPhoneAssistant:
    type: application
    platform: iOS

    dependencies:
      # 系统自带的 SQLite：对话消息、长期记忆、每日流水都存在 Documents/assistant.sqlite3
      # embed: false —— 它是系统的库，打进 App 包里没有意义
      - sdk: libsqlite3.tbd
        embed: false

    sources:
      - path: IPhoneAssistant
        # Info.plist 由 XcodeGen 依据下面的 info 段生成，必须排除，
        # 否则会被当成资源重复打包，报 "Multiple commands produce Info.plist"
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niuyuxiaosir.iphoneassistant.probe
        PRODUCT_NAME: IPhoneAssistant
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 图标来自 Assets.xcassets/AppIcon.appiconset（由 tools/make-appicon.ps1 生成）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 主题蓝也放资源目录（元宝那种饱和一点的蓝），系统控件跟着它走
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # CI 里做无签名构建，签名交给手机端的侧载工具完成
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

    info:
      path: IPhoneAssistant/Info.plist
      properties:
        CFBundleDisplayName: 私人助理
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 系统自带的界面（相机、照片选择器的按钮，要权限时的弹窗文字）按
        # 「App 支持的语言」挑语言，而支持的列表来自这里。之前没声明过，
        # 于是 App 被当成只有英文——相机页的「取消/重拍/使用照片」全是英文。
        # 这个 App 的界面就是中文的，所以只声明中文：系统件跟着一起变中文。
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # —— 权限声明 ——
        # 一律写成「拿它干什么」，主动语态、说具体的事（HIG 的 Privacy 页要求；
        # 反例是 Apple 自己举的「Microphone access is needed for a better experience.」）。
        NSMicrophoneUsageDescription: 录下会议内容，会后转成文字并生成纪要。只有你点了「开始记录会议」才会录音。
        NSSpeechRecognitionUsageDescription: 把录到的语音转成文字，用于会议纪要和速记。
        NSCameraUsageDescription: 拍白板、纸质笔记或名片，识别里面的待办和时间。
        NSCalendarsFullAccessUsageDescription: 把你说出的日程写进日历的「AI助理」列表；核对权限时会读一次日历。
        NSRemindersFullAccessUsageDescription: 把你说出的待办写进提醒事项的「AI助理」列表；核对权限时会读一次提醒事项。
        # 长按图标弹出的快捷菜单（3D Touch / Haptic Touch）
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.record
            UIApplicationShortcutItemTitle: 开始录音
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeRecordStart
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.newchat
            UIApplicationShortcutItemTitle: 新建对话
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.quickadd
            UIApplicationShortcutItemTitle: 速记一条
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
        # 后台持续录音的前提
        UIBackgroundModes:
          - audio
        # 让 Documents 目录出现在「文件」App 里，方便导出记录
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 只放开局域网/私有地址的 http（方便接自建代理），公网仍强制 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  IPhoneAssistant:
    build:
      targets:
        IPhoneAssistant: all
    run:
      config: Debug
    archive:
      config: Release
