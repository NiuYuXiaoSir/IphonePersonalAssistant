## XcodeGen 工程描述文件
## 用 CI 里的 `xcodegen generate` 生成 .xcodeproj，避免手工维护 project.pbxproj
##
## ⚠️ 需要你改的地方：PRODUCT_BUNDLE_IDENTIFIER
## 免费签名要求 App ID 全局唯一，如果 CI 能过但装机时报
## "The app ID ... is not available"，就换一个更随机的后缀再试。

name: IPhoneAssistant

options:
  bundleIdPrefix: com.niuyuxiaosir
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  IPhoneAssistant:
    type: application
    platform: iOS

    dependencies:
      # 系统自带的 SQLite：对话消息、长期记忆、每日流水都存在 Documents/assistant.sqlite3
      # embed: false —— 它是系统的库，打进 App 包里没有意义
      - sdk: libsqlite3.tbd
        embed: false

    sources:
      - path: IPhoneAssistant
        # Info.plist 由 XcodeGen 依据下面的 info 段生成，必须排除，
        # 否则会被当成资源重复打包，报 "Multiple commands produce Info.plist"
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niuyuxiaosir.iphoneassistant.probe
        PRODUCT_NAME: IPhoneAssistant
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 图标来自 Assets.xcassets/AppIcon.appiconset（由 tools/make-appicon.ps1 生成）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 主题蓝也放资源目录（元宝那种饱和一点的蓝），系统控件跟着它走
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # CI 里做无签名构建，签名交给手机端的侧载工具完成
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

    info:
      path: IPhoneAssistant/Info.plist
      properties:
        CFBundleDisplayName: 私人助理
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # —— 权限声明 ——
        NSMicrophoneUsageDescription: 录制会议音频，用于会后转写与总结。
        NSSpeechRecognitionUsageDescription: 把会议录音转成文字，用于生成纪要。
        NSCameraUsageDescription: 速记时拍照（白板、纸质笔记、名片），用于识别其中的待办与时间。
        NSCalendarsFullAccessUsageDescription: 读取和写入日历，用于管理你的工作日程。
        NSRemindersFullAccessUsageDescription: 读取和写入提醒事项，用于管理你的待办。
        # 长按图标弹出的快捷菜单（3D Touch / Haptic Touch）
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.record
            UIApplicationShortcutItemTitle: 开始录音
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeRecordStart
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.newchat
            UIApplicationShortcutItemTitle: 新建对话
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: com.niuyuxiaosir.iphoneassistant.probe.quickadd
            UIApplicationShortcutItemTitle: 速记一条
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
        # 后台持续录音的前提
        UIBackgroundModes:
          - audio
        # 让 Documents 目录出现在「文件」App 里，方便导出记录
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 只放开局域网/私有地址的 http（方便接自建代理），公网仍强制 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  IPhoneAssistant:
    build:
      targets:
        IPhoneAssistant: all
    run:
      config: Debug
    archive:
      config: Release
